name: Apply original OctoAVR32A icon
on:
  push:
    branches: [main]
    paths:
      - 'docs/original-octopus-icon.svg'
      - '.github/workflows/apply-original-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Convert uploaded SVG into Android launcher PNG
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          source = Path("docs/original-octopus-icon.svg")
          output = Path("app/src/main/res/drawable-nodpi/ic_launcher_original.png")
          output.parent.mkdir(parents=True, exist_ok=True)
          cairosvg.svg2png(url=str(source), write_to=str(output), output_width=512, output_height=512)
          print(f"Converted {source} to {output} (512x512)")
          PY
      - name: Ensure Android launcher uses the converted original icon
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/ic_launcher_original"')
          s = s.replace('android:roundIcon="@mipmap/ic_launcher"', 'android:roundIcon="@drawable/ic_launcher_original"')
          p.write_text(s)
          PY
      - name: Commit generated launcher icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/AndroidManifest.xml
          git add -f app/src/main/res/drawable-nodpi/ic_launcher_original.png
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
          else
            git commit -m "Use uploaded original SVG as app launcher icon"
            git pull --rebase origin main
            git push
          fi
