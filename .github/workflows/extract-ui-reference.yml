name: Extract Google AI Studio UI reference
on:
  push:
    branches:
      - ui-reference-extract
    paths:
      - GoogleAIStudio-UI-Reference.zip
      - .github/workflows/extract-ui-reference.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extraction branch
        uses: actions/checkout@v4
        with:
          ref: ui-reference-extract
          fetch-depth: 0

      - name: Extract UI reference archive
        shell: bash
        run: |
          set -euo pipefail
          test -s GoogleAIStudio-UI-Reference.zip
          mkdir -p ui-reference-extracted
          unzip -oq GoogleAIStudio-UI-Reference.zip -d ui-reference-extracted
          echo "Extracted file count:"
          find ui-reference-extracted -type f | wc -l
          echo "Top-level contents:"
          find ui-reference-extracted -mindepth 1 -maxdepth 2 -print | head -100
          test "$(find ui-reference-extracted -type f | wc -l)" -gt 0

      - name: Commit extracted source to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-reference-extracted/
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
            exit 0
          fi
          git commit -m "Extract Google AI Studio UI reference"
          git push origin HEAD:ui-reference-extract
