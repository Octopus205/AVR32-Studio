name: Android APK build
on:
  workflow_run:
    workflows: ["Build AVR-GCC for Android ARMv7"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Download Android ARMv7 AVR-GCC
        uses: actions/download-artifact@v4
        with:
          name: avr-gcc-android-armv7-api26
          path: /tmp/toolchain
          repository: Octopus205/AVR32-Studio
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Android ARMv7 AVR Binutils
        uses: actions/download-artifact@v4
        with:
          name: avr-binutils-android-armv7-api26
          path: /tmp/binutils
          repository: Octopus205/AVR32-Studio
          run-id: 42357553712
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download AVR Libc target runtime
        uses: actions/download-artifact@v4
        with:
          name: avr-libc-runtime
          path: /tmp/avr-libc
          repository: Octopus205/AVR32-Studio
          run-id: 42359867314
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble Android AVR toolchain package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/toolchain /tmp/avr-libc-unpacked
          echo "ASSEMBLY: dirs ready"
          cp -R /tmp/toolchain/. app/src/main/assets/toolchain/
          echo "ASSEMBLY: GCC files copied"
          mkdir -p app/src/main/assets/toolchain/bin
          cp /tmp/binutils/avr-* app/src/main/assets/toolchain/bin/
          echo "ASSEMBLY: binutils copied"
          tar -xzf /tmp/avr-libc/avr-libc-runtime.tar.gz -C /tmp/avr-libc-unpacked
          echo "ASSEMBLY: libc unpacked"
          cp -R /tmp/avr-libc-unpacked/avr app/src/main/assets/toolchain/
          echo "ASSEMBLY: libc copied"
          find app/src/main/assets/toolchain/bin app/src/main/assets/toolchain/libexec -type f -exec chmod 755 {} +
          echo "ASSEMBLY: executable bits restored"
          ls -l app/src/main/assets/toolchain/bin/
          test -x app/src/main/assets/toolchain/bin/avr-gcc
          echo "CHECK: avr-gcc"
          test -x app/src/main/assets/toolchain/bin/avr-as
          echo "CHECK: avr-as"
          test -x app/src/main/assets/toolchain/bin/avr-objcopy
          echo "CHECK: avr-objcopy"
          test -s app/src/main/assets/toolchain/libexec/gcc/avr/7.3.0/cc1
          echo "CHECK: cc1"
          test -s app/src/main/assets/toolchain/avr/include/avr/io.h
          echo "CHECK: avr libc headers"
          rm -rf app/src/main/assets/toolchain/share/info app/src/main/assets/toolchain/share/man
          test -s app/src/main/assets/toolchain/libexec/gcc/avr/7.3.0/liblto_plugin.so
          echo "CHECK: LTO linker plugin"
          rm -f app/src/main/assets/toolchain/bin/avr-gcov*
          chmod -R a+rX app/src/main/assets/toolchain
          (cd app/src/main/assets && zip -qr avr-toolchain-armv7.zip toolchain)
          rm -rf app/src/main/assets/toolchain
          echo "ASSEMBLY: archive created"
          ls -lh app/src/main/assets/avr-toolchain-armv7.zip
          test -s app/src/main/assets/avr-toolchain-armv7.zip
          echo "ASSEMBLY: archive verified"
      - name: Fetch MightyCore source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            https://github.com/MCUdude/MightyCore/archive/refs/tags/v3.1.0.zip \
            --output /tmp/mightycore-v3.1.0.zip
          unzip -q /tmp/mightycore-v3.1.0.zip -d /tmp
          test -s /tmp/MightyCore-3.1.0/avr/boards.txt
          grep -q 'mega32' /tmp/MightyCore-3.1.0/avr/boards.txt
          mkdir -p /tmp/octo-mightycore
          cp -R /tmp/MightyCore-3.1.0/avr /tmp/octo-mightycore/
          cp /tmp/MightyCore-3.1.0/LICENSE* /tmp/octo-mightycore/ 2>/dev/null || true
          (cd /tmp/octo-mightycore && zip -qr "$GITHUB_WORKSPACE/app/src/main/assets/mightycore-v3.1.0.zip" .)
          test -s app/src/main/assets/mightycore-v3.1.0.zip
      - name: Configure persistent APK signing
        shell: bash
        env:
          OCTO_KEYSTORE_BASE64: ${{ secrets.OCTO_KEYSTORE_BASE64 }}
          OCTO_KEYSTORE_PASSWORD: ${{ secrets.OCTO_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${OCTO_KEYSTORE_BASE64:-}" ] || [ -z "${OCTO_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Add repository Actions secrets OCTO_KEYSTORE_BASE64 and OCTO_KEYSTORE_PASSWORD before building."
            exit 1
          fi
          echo "$OCTO_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/octo-upload.jks"
          test -s "$GITHUB_WORKSPACE/app/octo-upload.jks"
          echo "OCTO_KEYSTORE_PATH=$GITHUB_WORKSPACE/app/octo-upload.jks" >> "$GITHUB_ENV"
          echo "OCTO_KEYSTORE_PASSWORD=$OCTO_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OctoAVR32A-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
