name: Android APK build
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      # Pin MightyCore so Arduino support is reproducible.
      - name: Fetch MightyCore source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            https://github.com/MCUdude/MightyCore/archive/refs/tags/v3.1.0.zip \
            --output /tmp/mightycore-v3.1.0.zip
          unzip -q /tmp/mightycore-v3.1.0.zip -d /tmp
          test -s /tmp/MightyCore-3.1.0/avr/boards.txt
          grep -q 'mega32' /tmp/MightyCore-3.1.0/avr/boards.txt
          mkdir -p /tmp/octo-mightycore
          cp -R /tmp/MightyCore-3.1.0/avr /tmp/octo-mightycore/
          cp /tmp/MightyCore-3.1.0/LICENSE* /tmp/octo-mightycore/ 2>/dev/null || true
          (cd /tmp/octo-mightycore && zip -qr "$GITHUB_WORKSPACE/app/src/main/assets/mightycore-v3.1.0.zip" .)
          test -s app/src/main/assets/mightycore-v3.1.0.zip
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OctoAVR32A-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
