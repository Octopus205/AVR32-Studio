name: Prepare AVR Libc runtime files
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/avr-libc-package.yml'

jobs:
  package-avr-libc:
    runs-on: ubuntu-latest
    steps:
      - name: Install AVR toolchain packages
        run: |
          sudo apt-get update
          sudo apt-get install -y avr-libc gcc-avr binutils-avr
      - name: Collect AVR Libc headers and libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/avr/include package/avr/lib output
          cp -R /usr/lib/avr/include/. package/avr/include/
          cp -R /usr/lib/avr/lib/. package/avr/lib/
          test -s package/avr/include/avr/io.h
          test -n "$(find package/avr/lib -type f -name 'libc.a' -o -name 'libm.a')"
          cat > /tmp/libc-check.c <<'EOF'
          #define F_CPU 8000000UL
          #include <avr/io.h>
          #include <util/delay.h>
          int main(void) { DDRB |= _BV(PB0); _delay_ms(1); return 0; }
          EOF
          avr-gcc -mmcu=atmega32 -Os -DF_CPU=8000000UL -c /tmp/libc-check.c -o /tmp/libc-check.o
          avr-gcc -mmcu=atmega32 /tmp/libc-check.o -o /tmp/libc-check.elf
          avr-objcopy -O ihex -R .eeprom /tmp/libc-check.elf /tmp/libc-check.hex
          test -s /tmp/libc-check.hex
          tar -czf output/avr-libc-runtime.tar.gz -C package avr
          tar -tzf output/avr-libc-runtime.tar.gz | head -30
      - name: Upload AVR Libc runtime
        uses: actions/upload-artifact@v4
        with:
          name: avr-libc-runtime
          path: output/avr-libc-runtime.tar.gz
          if-no-files-found: error
