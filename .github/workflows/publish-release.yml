name: Publish OctoAVR32A release
on:
  workflow_run:
    workflows: ["Android APK build"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact from successful build
        uses: actions/download-artifact@v4
        with:
          name: OctoAVR32A-debug
          path: release-assets
          repository: Octopus205/AVR32-Studio
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify APK
        run: |
          test -s release-assets/app-debug.apk
          mv release-assets/app-debug.apk release-assets/OctoAVR32A-Android-ARMv7.apk
          ls -lh release-assets/OctoAVR32A-Android-ARMv7.apk

      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.event.workflow_run.run_number }}
          name: OctoAVR32A v0.2.${{ github.event.workflow_run.run_number }}
          prerelease: true
          draft: false
          generate_release_notes: true
          files: release-assets/OctoAVR32A-Android-ARMv7.apk
          body: |
            Android ARMv7 test build of OctoAVR32A.

            - Target MCUs: ATmega32A / ATmega32
            - Architecture: 32-bit ARM (armeabi-v7a)
            - Minimum Android: 8.0 (API 26)
            - Status: Public preview / pre-release

            Please report issues through the repository.
