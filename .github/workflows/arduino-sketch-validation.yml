name: Arduino sketch validation (MightyCore)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/arduino-sketch-validation.yml'
      - 'app/src/main/**'

jobs:
  compile-arduino-sketch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Arduino CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://downloads.arduino.cc/arduino-cli/arduino-cli_latest_Linux_64bit.tar.gz -o /tmp/arduino-cli.tar.gz
          mkdir -p "$HOME/bin"
          tar -xzf /tmp/arduino-cli.tar.gz -C "$HOME/bin" arduino-cli
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/arduino-cli" version
      - name: Install MightyCore 3.1.0
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli core update-index --additional-urls https://mcudude.github.io/MightyCore/package_MCUdude_MightyCore_index.json
          arduino-cli core install MightyCore:avr@3.1.0 --additional-urls https://mcudude.github.io/MightyCore/package_MCUdude_MightyCore_index.json
          arduino-cli core list
      - name: Create ATmega32 Arduino test sketch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/OctoBlink"
          cat > "$RUNNER_TEMP/OctoBlink/OctoBlink.ino" <<'EOF'
          #define LED_PIN 0
          void setup() {
            pinMode(LED_PIN, OUTPUT);
          }
          void loop() {
            digitalWrite(LED_PIN, HIGH);
            delay(500);
            digitalWrite(LED_PIN, LOW);
            delay(500);
          }
          EOF
      - name: Compile for ATmega32 at 8 MHz
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile --verbose \
            --fqbn MightyCore:avr:32:clock=8MHz_internal \
            --build-path "$RUNNER_TEMP/octo-build" \
            "$RUNNER_TEMP/OctoBlink"
          test -s "$RUNNER_TEMP/octo-build/OctoBlink.ino.elf"
          test -s "$RUNNER_TEMP/octo-build/OctoBlink.ino.hex"
          mkdir -p output
          cp "$RUNNER_TEMP/octo-build/OctoBlink.ino.elf" output/ATmega32-8MHz.elf
          cp "$RUNNER_TEMP/octo-build/OctoBlink.ino.hex" output/ATmega32-8MHz.hex
      - name: Upload verified Arduino outputs
        uses: actions/upload-artifact@v4
        with:
          name: OctoAVR32A-MightyCore-Arduino-validation
          path: output/*
          if-no-files-found: error
