name: Build AVR-GCC for Android ARMv7
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-avr-gcc.yml'

jobs:
  build-gcc:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo wget xz-utils file gcc-avr binutils-avr avr-libc
      - name: Install Android NDK r26d
        shell: bash
        run: |
          set -euo pipefail
          wget --quiet https://dl.google.com/android/repository/android-ndk-r26d-linux.zip -O "$RUNNER_TEMP/ndk.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "NDK=$RUNNER_TEMP/android-ndk-r26d" >> "$GITHUB_ENV"
      - name: Download GCC and prerequisite sources
        shell: bash
        run: |
          set -euo pipefail
          wget --quiet https://ftp.gnu.org/gnu/gcc/gcc-7.3.0/gcc-7.3.0.tar.xz -O "$RUNNER_TEMP/gcc.tar.xz"
          tar -xf "$RUNNER_TEMP/gcc.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/gcc-7.3.0"
          ./contrib/download_prerequisites
          # Bionic does not export glibc-only fread_unlocked on all API levels.
          # GCC build-time generator gengtype can safely use portable fread.
          grep -RIl "fread_unlocked" gcc libiberty 2>/dev/null | while read -r file; do sed -i "s/fread_unlocked/fread/g" "$file"; done
          find gcc -name "*lex.c" -exec touch {} +
      - name: Configure and build AVR GCC driver for Android ARMv7
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC="$TOOLCHAIN/bin/armv7a-linux-androideabi26-clang"
          export CXX="$TOOLCHAIN/bin/armv7a-linux-androideabi26-clang++"
          export CC_FOR_BUILD=gcc
          export CXX_FOR_BUILD=g++
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export CFLAGS="-O2 -fPIE"
          export LDFLAGS="-pie"
          export CXXFLAGS="-O2 -fPIE -std=gnu++14 -Wno-register"
          mkdir -p "$RUNNER_TEMP/build-gcc" "$RUNNER_TEMP/avr-gcc-prefix"
          cd "$RUNNER_TEMP/build-gcc"
          "$RUNNER_TEMP/gcc-7.3.0/configure" \
            --build=x86_64-pc-linux-gnu \
            --host=arm-linux-androideabi \
            --target=avr \
            --prefix="$RUNNER_TEMP/avr-gcc-prefix" \
            --enable-languages=c,c++ --disable-nls --disable-bootstrap \
            --disable-libssp --disable-libcc1 --disable-shared --disable-threads \
            --disable-libstdcxx-pch --disable-libquadmath --disable-libgomp \
            --disable-libatomic --disable-libsanitizer --without-headers --with-newlib \
            --with-as=/usr/bin/avr-as --with-ld=/usr/bin/avr-ld
          # Native AVR GCC is used only to generate specs while cross-building the Android-hosted compiler.
          make -j2 GCC_FOR_TARGET=avr-gcc all-gcc
          make GCC_FOR_TARGET=avr-gcc install-gcc
          make -j2 GCC_FOR_TARGET=avr-gcc all-target-libgcc
          make GCC_FOR_TARGET=avr-gcc install-target-libgcc
          test -x "$RUNNER_TEMP/avr-gcc-prefix/bin/avr-gcc"
          test -x "$RUNNER_TEMP/avr-gcc-prefix/bin/avr-g++"
          file "$RUNNER_TEMP/avr-gcc-prefix/bin/avr-gcc"
          readelf -h "$RUNNER_TEMP/avr-gcc-prefix/bin/avr-gcc" | grep -E 'Class:|Machine:'
          test -x "$RUNNER_TEMP/avr-gcc-prefix/libexec/gcc/avr/7.3.0/cc1"
          test -s "$RUNNER_TEMP/avr-gcc-prefix/lib/gcc/avr/7.3.0/avr5/libgcc.a"
          # ATmega32 and ATmega32A are avr5 devices; discard unused MCU multilibs.
          MULTILIB="$RUNNER_TEMP/avr-gcc-prefix/lib/gcc/avr/7.3.0"
          find "$MULTILIB" -mindepth 1 -maxdepth 1 -type d ! -name device-specs ! -name avr5 -exec rm -rf {} +
          du -sh "$RUNNER_TEMP/avr-gcc-prefix"
          file "$RUNNER_TEMP/avr-gcc-prefix/libexec/gcc/avr/7.3.0/cc1"
          readelf -h "$RUNNER_TEMP/avr-gcc-prefix/libexec/gcc/avr/7.3.0/cc1" | grep -E "Class:|Machine:"
          # Bundle the Android NDK C++ shared runtime required by NDK-linked GCC executables.
          mkdir -p "$RUNNER_TEMP/avr-gcc-prefix/lib"
          test -s "$TOOLCHAIN/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so"
          cp "$TOOLCHAIN/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so" "$RUNNER_TEMP/avr-gcc-prefix/lib/libc++_shared.so"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp -R "$RUNNER_TEMP/avr-gcc-prefix/." "$GITHUB_WORKSPACE/output/"
      - name: Upload Android ARMv7 AVR GCC
        uses: actions/upload-artifact@v4
        with:
          name: avr-gcc-android-armv7-api26
          path: output/**
          if-no-files-found: error
