plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.octopus.avr32studio'
    compileSdk 34
    defaultConfig {
        applicationId 'com.octopus.avr32studio'
        minSdk 26
        targetSdk 28
        versionCode (project.findProperty('appVersionCode') ?: '2').toString().toInteger()
        versionName (project.findProperty('appVersionName') ?: '0.2.0').toString()
    }
    signingConfigs {
        persistent {
            storeFile file(System.getenv('OCTO_KEYSTORE_PATH') ?: 'octo-upload.jks')
            storePassword System.getenv('OCTO_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'octoavr'
            keyPassword System.getenv('OCTO_KEYSTORE_PASSWORD') ?: ''
        }
    }
    buildTypes {
        debug {
            if (System.getenv('OCTO_KEYSTORE_PATH') != null) {
                signingConfig signingConfigs.persistent
            }
        }
        release {
            minifyEnabled false
            if (System.getenv('OCTO_KEYSTORE_PATH') != null) {
                signingConfig signingConfigs.persistent
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}
